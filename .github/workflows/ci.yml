name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway-rs
      - name: Check formatting
        run: cargo fmt --manifest-path gateway-rs/Cargo.toml --all -- --check
      - name: Verify pinned Python parity reference
        run: |
          git branch --force python-parity-reference 10699820f50abe3940134536a98c955deab6959f
          python3 scripts/check_parity_reference.py
      - name: Verify Python-to-Rust test coverage ledger
        run: python3 scripts/generate_test_coverage_ledger.py --check
      - name: Verify Python-to-Rust source coverage ledger
        run: python3 scripts/generate_source_coverage_ledger.py --check
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run Clippy
        run: cargo clippy --manifest-path gateway-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path gateway-rs/Cargo.toml --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - name: Install dependencies
        working-directory: web-client
        run: npm ci
      - name: Audit production dependencies
        working-directory: web-client
        run: npm audit --omit=dev --audit-level=high
      - name: Build web client
        working-directory: web-client
        env:
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:3001
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Rust-only image
        run: docker build --tag doorman:ci .

  external-storage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Run isolated MongoDB and Redis integration suite
        env:
          DOORMAN_EXTERNAL_STORAGE_LOG_DIR: external-storage-logs
        run: bash scripts/run_external_storage_tests.sh
      - name: Retain external-service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-storage-logs
          path: external-storage-logs
          if-no-files-found: error
          retention-days: 14
