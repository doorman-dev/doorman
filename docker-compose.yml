# Doorman API Gateway
#
# Memory mode (default): docker compose up --build
# Shared mode: MEM_OR_EXTERNAL=REDIS docker compose --profile external up --build

services:
  doorman:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PROTECTED_USERS: ${NEXT_PUBLIC_PROTECTED_USERS:-}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
    image: doorman:latest
    container_name: doorman
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    env_file:
      - .env
    environment:
      MEM_OR_EXTERNAL: ${MEM_OR_EXTERNAL:-MEM}
      MONGO_DB_HOSTS: ${MONGO_DB_HOSTS:-mongo:27017}
      MONGO_DB_USER: ${MONGO_DB_USER:-doorman_admin}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      MONGO_DB_AUTH_SOURCE: ${MONGO_DB_AUTH_SOURCE:-admin}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      MEM_DUMP_PATH: ${MEM_DUMP_PATH:-/app/data/memory_dump.bin}
      SECURITY_SETTINGS_FILE: ${SECURITY_SETTINGS_FILE:-/app/data/security_settings.json}
      MEM_AUTO_SAVE_ENABLED: ${MEM_AUTO_SAVE_ENABLED:-true}
      MEM_AUTO_SAVE_FREQ: ${MEM_AUTO_SAVE_FREQ:-300}
      PYTHONINTMAXSTRDIGITS: ${PYTHONINTMAXSTRDIGITS:-4300}
      MEM_ENCRYPTION_KEY: ${MEM_ENCRYPTION_KEY:-}
      LOGS_ENABLED: ${LOGS_ENABLED:-true}
      LOGS_DIR: /app/logs
    volumes:
      - doorman-generated:/app/data
      - doorman-logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
    networks:
      - default
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:$${PORT:-3001}/platform/monitor/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    profiles: ["external"]
    image: redis:7-alpine
    container_name: doorman-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    command:
      - sh
      - -ec
      - 'test -n "$$REDIS_PASSWORD"; exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 3

  mongo:
    profiles: ["external"]
    image: mongo:7
    container_name: doorman-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER:-doorman_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:?MONGO_DB_PASSWORD must be set}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    restart: unless-stopped
    command: --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  backend:
    internal: true

volumes:
  redis-data:
  mongo-data:
  doorman-generated:
  doorman-logs:
